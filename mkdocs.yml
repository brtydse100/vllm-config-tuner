site_name: vLLM Optimizer
site_description: Benchmark-driven configuration optimization for vLLM inference servers
site_url: https://brtydse100.github.io/vllm-optimizer/
repo_url: https://github.com/brtydse100/vllm-optimizer
repo_name: brtydse100/vllm-optimizer
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Overview: index.md
  - Start here:
      - Quick start: getting-started/index.md
      - Installation choices: getting-started/installation.md
  - Configure and run:
      - Configuration: guides/configuration.md
      - YAML reference:
          - Overview: reference/yaml/full-example.md
          - Server and tuning: reference/yaml/full-example-server.md
          - Benchmarks and optimization: reference/yaml/full-example-benchmark.md
          - Execution and logging: reference/yaml/full-example-execution.md
          - vLLM Bench Serve: reference/yaml/full-example-vllm-bench.md
      - Benchmarks:
          - Overview and vLLM Bench Serve: guides/benchmarks/benchmarking.md
          - GuideLLM options: guides/benchmarks/benchmark-guidellm.md
          - Datasets: guides/benchmarks/benchmark-data.md
          - Repeats and errors: guides/benchmarks/benchmark-repeats.md
          - Backend comparison: guides/benchmarks/backend-comparison.md
      - Search and scoring: guides/search-and-scoring.md
      - Parallel trials: guides/parallel-trials.md
  - Results and operations:
      - Reports: guides/reports.md
      - Real GPU examples: results/index.md
      - GPU experiment recipes: experiments/README.md
      - H100 scenario suite: experiments/h100/README.md
      - Reproduce the RTX examples: experiments/local-reproduction.md
      - RTX 3080 results: results/rtx3080/index.md
      - H100 results archive: results/h100/index.md
      - Troubleshooting: guides/troubleshooting.md
      - Migration from vtune: guides/migration-vllm-optimizer.md
  - Reference:
      - CLI: reference/cli.md
      - Compatibility: reference/compatibility.md
  - Project:
      - Architecture: project/ARCHITECTURE.md
      - MVP specification:
          - Overview: project/mvp/MVP_SPEC.md
          - Configuration: project/mvp/configuration.md
          - Runtime and acceptance: project/mvp/runtime.md
      - Roadmap:
          - Overview: project/roadmap/ROADMAP.md
          - Engine and benchmarks: project/roadmap/engine.md
          - Optimization: project/roadmap/optimization.md
          - Local execution: project/roadmap/local-execution.md
          - Distributed and reporting: project/roadmap/distributed.md
          - APIs, cost, and capacity: project/roadmap/integrations.md
          - Cross-cutting requirements: project/roadmap/requirements.md
      - Trust plan: project/TRUST_PLAN.md
      - Contributing: project/contributing.md
      - Release checklist: project/release-checklist.md
  - Release notes:
      - v0.1.0a20: project/releases/v0.1.0a20.md
      - v0.1.0a19: project/releases/v0.1.0a19.md
      - v0.1.0a18: project/releases/v0.1.0a18.md
      - v0.1.0a17: project/releases/v0.1.0a17.md
      - v0.1.0a16: project/releases/v0.1.0a16.md
      - v0.1.0a15: project/releases/v0.1.0a15.md
      - v0.1.0a13: project/releases/v0.1.0a13.md
      - v0.1.0a12: project/releases/v0.1.0a12.md
      - v0.1.0a11: project/releases/v0.1.0a11.md
      - v0.1.0a10: project/releases/v0.1.0a10.md
      - v0.1.0a9: project/releases/v0.1.0a9.md
      - v0.1.0a8: project/releases/v0.1.0a8.md
      - v0.1.0a7: project/releases/v0.1.0a7.md
      - v0.1.0a6: project/releases/v0.1.0a6.md
      - v0.1.0a5: project/releases/v0.1.0a5.md
      - v0.1.0a4: project/releases/v0.1.0a4.md
      - v0.1.0a3: project/releases/v0.1.0a3.md
      - v0.1.0a2: project/releases/v0.1.0a2.md
      - v0.1.0a1: project/releases/v0.1.0a1.md
      - Changelog archive: project/releases/CHANGELOG_ARCHIVE.md
      - Current changelog: https://github.com/brtydse100/vllm-optimizer/blob/main/CHANGELOG.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/brtydse100/vllm-optimizer
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vllm-optimizer/
