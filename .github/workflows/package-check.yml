name: Check Python package
on: {push: {branches: [main]}, pull_request: {}, merge_group: {}, workflow_dispatch: {}}
permissions: {contents: read}

jobs:
  software-gates:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {python-version: ["3.11", "3.12"]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ matrix.python-version }}", cache: pip}
      - run: python -m pip install --upgrade pip "setuptools>=83" ".[test]" -r requirements-docs.txt cyclonedx-bom
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy
      - run: python -m coverage run -m pytest
      - run: python -m coverage xml && python -m coverage json && python -m coverage report
      - if: matrix.python-version == '3.12'
        run: python scripts/check_coverage.py
      - if: matrix.python-version == '3.12'
        run: python -m mkdocs build --strict
      - run: python -m build && python -m twine check dist/*
      - run: python -m pip uninstall -y vllm-optimizer && python -m pip install --no-deps dist/*.whl
      - run: python -m pip check
      - run: python -c "import pathlib,vllm_optimizer; assert 'site-packages' in str(pathlib.Path(vllm_optimizer.__file__).resolve())"
      - run: python -m pytest -q --import-mode=importlib tests
      - run: python -m pip_audit
      - run: cyclonedx-py environment --output-format json --output-file sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: software-evidence-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
            dist/*
            sbom.json
          if-no-files-found: error
